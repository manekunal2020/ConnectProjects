server.port=${SERVER_PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/connect_projects}
spring.datasource.username=${DATABASE_USERNAME:connect_projects}
spring.datasource.password=${DATABASE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET:dev-only-change-this-jwt-signing-secret-before-deployment}
app.jwt.expiration=PT8H
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}
app.bootstrap-super-user.username=${BOOTSTRAP_SUPERUSER_USERNAME:}
app.bootstrap-super-user.password=${BOOTSTRAP_SUPERUSER_PASSWORD:}
app.bootstrap-super-user.name=${BOOTSTRAP_SUPERUSER_NAME:}
